<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>토킹 튜터</title>
<style>
  :root {
    --bg: #F5F6FB; --surface: #fff; --ink: #14161F; --ink-2: #3D4055;
    --muted: #666983; --line: #DFE1EE; --accent: #2F3FD4; --accent-soft: #E7E9FC;
    --err: #8A2020; --err-soft: #FBE4E4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0D0E15; --surface: #161822; --ink: #E9EAF3; --ink-2: #C0C3D6;
      --muted: #9294AC; --line: #272A3A; --accent: #8D9AFF; --accent-soft: #21243B;
      --err: #F0A0A0; --err-soft: #2B1414;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display: flex; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    padding: 14px 16px; border-bottom: 1px solid var(--line);
    background: var(--surface); flex: none;
    display: flex; align-items: center; gap: 12px;
  }
  header > div { flex: 1; min-width: 0; }
  .ghost {
    flex: none; background: transparent; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 13px; font-size: 13px; font-weight: 500;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 13px; border-radius: 14px; line-height: 1.55; font-size: 15px; }
  .me { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .sys { align-self: center; font-size: 13px; color: var(--muted); text-align: center; max-width: 90%; }
  .err {
    align-self: center; max-width: 92%; background: var(--err-soft); color: var(--err);
    border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word;
  }
  .typing { color: var(--muted); font-style: italic; }

  form {
    display: flex; gap: 8px; padding: 12px 16px 16px;
    border-top: 1px solid var(--line); background: var(--surface); flex: none;
  }
  input[type=text] {
    flex: 1; min-width: 0; font-size: 16px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--bg); color: var(--ink);
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    flex: none; font-size: 15px; font-weight: 600; padding: 12px 18px;
    border: none; border-radius: 999px; background: var(--accent); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .5; }
</style>
</head>
<body>

<header>
  <div>
    <h1>토킹 튜터</h1>
    <p>Day 4 · 대화가 이어집니다</p>
  </div>
  <button type="button" id="reset" class="ghost">새 대화</button>
</header>

<div id="log">
  <div class="sys">영어로 아무 말이나 걸어보세요.<br>예 — <b>Hi! How are you today?</b></div>
</div>

<form id="form" autocomplete="off">
  <input type="text" id="input" placeholder="영어로 입력하세요" enterkeyhint="send">
  <button type="submit" id="send">보내기</button>
</form>

<script>
  var log = document.getElementById('log');
  var form = document.getElementById('form');
  var input = document.getElementById('input');
  var send = document.getElementById('send');
  var reset = document.getElementById('reset');

  // 지금까지의 대화. 이 배열이 봇의 "기억"입니다.
  // 구글은 아무것도 기억하지 않습니다. 매번 이걸 통째로 다시 들려줍니다.
  var history = [];

  function add(cls, text) {
    var el = document.createElement('div');
    el.className = cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;

    add('msg me', text);
    input.value = '';
    input.disabled = true;
    send.disabled = true;

    // 보내기 전에 기록에 넣습니다.
    history.push({ role: 'user', text: text });

    var waiting = add('msg bot typing', '...');

    try {
      var res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });
      var data = await res.json();
      waiting.remove();

      if (!res.ok || data.error) {
        // 무엇이 잘못됐는지 화면에 그대로 보여줍니다. 그래야 고칠 수 있습니다.
        // 실패한 말은 기록에서 빼야 다음 요청이 꼬이지 않습니다.
        history.pop();
        add('err', '문제가 생겼습니다.\n' + (data.error || ('HTTP ' + res.status)) + (data.debug ? '\n\n' + data.debug : ''));
      } else {
        history.push({ role: 'model', text: data.reply });
        add('msg bot', data.reply);
      }
    } catch (err) {
      waiting.remove();
      history.pop();
      add('err', '서버에 연결하지 못했습니다.\n' + err.message);
    }

    input.disabled = false;
    send.disabled = false;
    input.focus();
  });

  reset.addEventListener('click', function () {
    history = [];
    log.innerHTML = '';
    add('sys', '새 대화를 시작합니다. 앞의 얘기는 잊었습니다.');
    input.focus();
  });
</script>
</body>
</html>
